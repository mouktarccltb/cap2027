<style>
:root{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0D1830;--muted:#54607A;--line:#D5DBE6;--navy:#16306B;--on-navy:#FFFFFF;--gold:#C09234;--gold-ink:#86610F;--warn:#9A3412}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;padding:24px 16px}
main{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:18px;padding:30px 28px;display:grid;gap:14px}
.ey{font:500 12px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink)}
h1{margin:0;font-size:30px;line-height:1.1}
p{margin:0;color:var(--muted)}
label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
input{font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:700;padding:12px 20px;border:0;border-radius:999px;background:var(--navy);color:var(--on-navy);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.st{min-height:1.5em;font-size:15px}
.st.warn{color:var(--warn)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.chk input{width:18px;height:18px}
small{color:var(--muted);font-size:13px}
</style>

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
async function open(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(DATA.iv)}, key, b64d(DATA.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function fromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64d(DATA.salt), iterations:DATA.it}, base, 256));
}
(async () => {
  let saved = null; try { saved = sessionStorage.getItem("cap2027-cle") || localStorage.getItem("cap2027-cle"); } catch(e){}
  if (saved) { try { const h = await open(b64d(saved)); show(h); return; } catch(e){ try { sessionStorage.removeItem("cap2027-cle"); localStorage.removeItem("cap2027-cle"); } catch(_){} } }
  const f = document.getElementById("f"), pw = document.getElementById("pw"), st = document.getElementById("st"), go = document.getElementById("go");
  if (!(window.crypto && crypto.subtle)) { st.className = "st warn"; st.textContent = "Ce navigateur ne permet pas d'ouvrir le kit : utilisez une version récente d'Edge, de Chrome ou de Firefox."; go.disabled = true; return; }
  pw.focus();
  let fails = 0;
  f.addEventListener("submit", async e => {
    e.preventDefault();
    go.disabled = true; st.className = "st"; st.textContent = "Vérification…";
    try {
      const raw = await fromPassword(pw.value);
      const h = await open(raw);
      try { sessionStorage.setItem("cap2027-cle", b64e(raw)); if (document.getElementById("keep").checked) localStorage.setItem("cap2027-cle", b64e(raw)); } catch(_){}
      show(h);
    } catch(err){
      fails++; go.disabled = false; pw.value = ""; pw.focus();
      st.className = "st warn"; st.textContent = fails > 2 ? "Mot de passe incorrect. Il figure dans le courriel d'envoi du kit ; en cas de doute, demandez-le au DGA." : "Mot de passe incorrect.";
    }
  });
})();
